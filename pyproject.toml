[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "autoweld"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = ["i2rt", "viser", "yourdfpy", "cadquery", "opencv-python-headless"]

[project.scripts]
autoweld = "autoweld.app:cli"

[tool.setuptools.packages.find]
include = ["autoweld*"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 110

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]
